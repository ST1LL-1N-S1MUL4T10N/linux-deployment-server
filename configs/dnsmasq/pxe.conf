interface=ens33
bind-interfaces
port=0

dhcp-authoritative
dhcp-range=172.16.110.100,172.16.110.200,255.255.255.0,12h

dhcp-option=option:router,172.16.110.1
dhcp-option=option:dns-server,172.16.110.10

dhcp-match=set:ipxe,175

dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9

dhcp-boot=tag:!ipxe,tag:efi64,ipxe.efi
dhcp-boot=tag:!ipxe,tag:!efi64,undionly.kpxe
dhcp-boot=tag:ipxe,http://172.16.110.10/boot.ipxe

enable-tftp
tftp-root=/srv/tftp
