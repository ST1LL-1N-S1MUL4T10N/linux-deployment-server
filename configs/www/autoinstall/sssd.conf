[nss]
# The following prevents SSSD from searching for the root user/group in
# all domains (you can add here a comma-separated list of system accounts that
# are always going to be /etc/passwd users, or that you want to filter out).
filter_users = root,named,avahi,haldaemon,dbus,radiusd,news,nscd,superuser,ansible
filter_groups = root
debug_level = 2
reconnection_retries = 3

[pam]
debug_level = 2
# If the authentication provider is offline, how long should we allow cached logins (in days since the last successful online login).
offline_credentials_expiration = 60
reconnection_retries = 3

[sssd]
config_file_version = 2
reconnection_retries = 3
sbus_timeout = 30
# services = nss, pam
domains = EXAMPLE
debug_level = 1
#default_domain_suffix = EXAMPLE

[domain/EXAMPLE]
debug_level = 2
        
# by default the expected min_id is 1000.
min_id = 450

# 'data backend to use'
id_provider = ldap
# 'authentication provider'
auth_provider = ldap
chpass_provider = ldap

# filter access by ldap user group, needed for 'filter_users' above.
access_provider = ldap
# make sure only user accounts log in.
ldap_access_filter = (&(objectClass=user)(!(objectClass=computer)))

# allow all users to login by default - disabled.
#;access_provider = simple
#;simple_allow_users =
#;simple_deny_users = 

# bind to LDAP service on port 389.
# ldap_uri = ldap://172.16.1.1:389, ldap://172.16.1.2:389
ldap_uri = ldaps://example.local:636
ldap_default_bind_dn = cn=ldap_read,cn=Users,dc=example,dc=local
ldap_default_authtok = CHANGE_ME

# default searches
ldap_search_base = OU=EXAMPLE,DC=example,DC=local
# An optional base DN to restrict user searches to a specific subtree
# default: the value of 'ldap_search_base'
ldap_user_search_base = OU=EXAMPLE,dc=example,dc=local
ldap_group_search_base = OU=EXAMPLE,dc=example,dc=local

## AD specific settings, see man sssd_ad
# defines user/group schema type
ldap_schema = ad

# set reasonable defaults in case AD does not provide them.
default_shell = /bin/bash
# overrides preconfigured home directory. Needed for desktop and for now for server until we configured network homes
override_homedir = /home/%u
fallback_homedir = /tmp

# performance
ldap_referrals = false

# let 'access_filter' and AD take case of access control. 
ldap_access_order = filter, expire
ldap_account_expire_policy = ad

# basic object classes.
ldap_user_object_class = user
ldap_group_object_class = group

## basic field mapping
ldap_user_name = sAMAccountName

# 'uidNumber' does work if we connect via port 389, not 3268.
# connecting to port 3268 gives error 'no uid provided for [kotowicza] in domain [AD]'
ldap_user_uid_number = uidNumber
ldap_user_gid_number = gidNumber

# For SID-UID mapping. If you want to disable ID mapping and 
# instead rely on POSIX attributes defined in Active Directory, 
# you should set 'ldap_id_mapping = false'
# If set to false, the uidNumber and gidNumber are used.
# If set to true, the AD username and group ids are used.
ldap_id_mapping = false

# make sure the home directory and the shell are mapped correctly.
ldap_user_home_directory = unixHomeDirectory
ldap_user_shell = loginShell

# Active Directory delivers the realm part of the UPN in lower case, so we set to true.
ldap_force_upper_case_realm = True

# NON-SSL configuration.
# Specifies what checks to perform on server certificates in a TLS
# session, if any.
# ldap_tls_reqcert = never
# Specifies that the id_provider connection must also use tls to
# protect the channel.
# ldap_id_use_start_tls = false
# 
# SSL configuration.
# TODO: check if 'allow' is the correct value - maybe we need to import the 
# certificate?
ldap_tls_reqcert = allow
# Specifies that the id_provider connection must also use tls to
# protect the channel.
ldap_id_use_start_tls = true

# How many seconds should nss_sss consider entries valid before asking the backend again
# set here to 4 hours
entry_cache_timeout = 14400

## caching credentials
# Determines if user credentials are also cached in the local LDB cache
cache_credentials = true
# Number of days entries are left in cache after last successful login before being removed during a cleanup of the cache. 0 means keep forever. The value of this parameter must be greater than or equal to offline_credentials_expiration.
account_cache_expiration = 61
###
krb5_realm = EXAMPLE
dns_discovery_domain = EXAMPLE
krb5_store_password_if_offline = True
krb5_lifetime = 120s
krb5_renewable_lifetime = 150m
krb5_renew_interval = 10s

# When enumeration is enabled, reinitializing a client results in a complete 
# refresh of the entire set of available users and groups from the remote source.
enumerate = true

# disable case sensitive user names
case_sensitive = false

# Regular expression to display username sent by gpfs
re_expression = (((?P<domain>[^\\]+)\\(?P<name>.+$))|((?P<name>[^@]+)@(?P<domain>.+$))|(^(?P<name>[^@\\]+)$))
