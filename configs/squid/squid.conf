http_port 3128

acl allowed_subnet src 172.16.110.0/24
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow localhost
http_access allow allowed_subnet
http_access deny all

# Caching rules tuned for Canonical / Snapcraft CDNs
cache_dir ufs /var/spool/squid 50000 16 256
maximum_object_size 4096 MB
cache_mem 1024 MB

refresh_pattern \.snap$         43200 100% 525600 override-expire override-lastmod reload-into-ims ignore-reload
refresh_pattern snapcraft\.io   43200 100% 525600 override-expire override-lastmod
refresh_pattern amazonaws\.com  43200 100% 525600 override-expire override-lastmod
